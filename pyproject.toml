[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patentcodes"
version = "0.1.0"
description = "Machine-readable green/clean patent classification code lists for research"
requires-python = ">=3.9"
dependencies = ["pandas"]
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = ["pytest", "openpyxl"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
